# ─────────────────────────────────────────────────────────────────────────────
# Congregation Event Management — nginx production config
#
# Expected subdomains (adjust SERVER_NAME values to match your domain):
#   congregation.university.edu        → Graduate Portal
#   admin.congregation.university.edu  → Admin Console
#   gate.congregation.university.edu   → Gate Scanner PWA
#   api.congregation.university.edu    → Backend API  (proxied)
#
# TLS: Place certificate at  nginx/ssl/fullchain.pem
#      Place private key at  nginx/ssl/privkey.pem
#      (Certbot / Let's Encrypt recommended)
# ─────────────────────────────────────────────────────────────────────────────

# Shared proxy settings for WebSocket upgrade (used by Socket.io)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Upstream ─────────────────────────────────────────────────────────────────

upstream api_backend {
    server api:3000;
    keepalive 32;
}

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────

server {
    listen 80;
    server_name
        congregation.university.edu
        admin.congregation.university.edu
        gate.congregation.university.edu
        api.congregation.university.edu;

    return 301 https://$host$request_uri;
}

# ── Graduate Portal ───────────────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name congregation.university.edu;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /usr/share/nginx/html/portal;
    index index.html;

    # HTML — no caching (always fresh for SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed assets — long cache
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}

# ── Admin Console ─────────────────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name admin.congregation.university.edu;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /usr/share/nginx/html/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}

# ── Gate Scanner PWA ──────────────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name gate.congregation.university.edu;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /usr/share/nginx/html/gate;
    index index.html;

    # Service worker must be served from root scope with no caching
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}

# ── Backend API ───────────────────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name api.congregation.university.edu;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # REST API
    location /api/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.io (long-poll + WebSocket upgrade)
    location /socket.io/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;   # keep WS alive for up to 24h
    }

    # Health check (unauthenticated)
    location /health {
        proxy_pass http://api_backend;
    }
}

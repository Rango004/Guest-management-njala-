<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="a3" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1B5299"/>
      <stop offset="100%" stop-color="#0E3466"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="#EEF3FA"/>
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="#BFCEE5" stroke-width="2"/>
  
  <g fill="url(#a3)">
    <rect x="68" y="68" width="46" height="180" rx="5"/>
    <rect x="224" y="68" width="46" height="180" rx="5"/>
    <polygon points="68,68 114,68 270,215 270,248 224,248 68,101"/>
    <rect x="292" y="68" width="46" height="142" rx="5"/>
    <rect x="408" y="68" width="46" height="142" rx="5"/>
    <path d="M292,188 L292,212 Q292,248 330,248 L416,248 Q454,248 454,212 L454,188" fill="url(#a3)"/>
  </g>
  
  <!-- Gate -->
  <rect x="130" y="268" width="252" height="7" rx="2" fill="#1B5299" opacity="0.3"/>
  <rect x="130" y="268" width="8" height="118" rx="2" fill="#1B5299" opacity="0.3"/>
  <rect x="374" y="268" width="8" height="118" rx="2" fill="#1B5299" opacity="0.3"/>
  
  <g transform="translate(256,344) scale(0.7)">
      <!-- Graduation cap -->
      <rect x="-16" y="-70" width="32" height="5" rx="1" fill="#1B5299"/>
      <polygon points="-20,-70 20,-70 0,-80" fill="#1B5299"/>
      <line x1="-16" y1="-67" x2="-22" y2="-57" stroke="#1B5299" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-23" cy="-55" r="2.5" fill="#1B5299"/>
      <!-- Head -->
      <circle cx="0" cy="-52" r="14" fill="#1B5299"/>
      <!-- Body - slight forward lean -->
      <line x1="2" y1="-38" x2="6" y2="4" stroke="#1B5299" stroke-width="14" stroke-linecap="round"/>
      <!-- Right arm forward -->
      <line x1="5" y1="-30" x2="22" y2="-8" stroke="#1B5299" stroke-width="9" stroke-linecap="round"/>
      <!-- Left arm back -->
      <line x1="2" y1="-30" x2="-18" y2="-14" stroke="#1B5299" stroke-width="9" stroke-linecap="round"/>
      <!-- Right leg forward (big stride) -->
      <line x1="6" y1="0" x2="28" y2="38" stroke="#1B5299" stroke-width="10" stroke-linecap="round"/>
      <!-- Left leg back -->
      <line x1="4" y1="0" x2="-18" y2="40" stroke="#1B5299" stroke-width="10" stroke-linecap="round"/>
    </g>
  
  <text x="256" y="440" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="bold" 
